services:
  smart-home-dashboard:
    container_name: smart-home-dashboard
    image: daddelgreis74/smart-home-dashboard:latest
    restart: unless-stopped
    # network_mode: "host"
    ports:
      - "8443:8443"
      - "8888:8888/udp"
    volumes:
      # Mountet alle Konfigurationen und Kalender-Uploads (calendar.ics) in einen lokalen Ordner
      - ./data:/app/data
    environment:
      - PORT=8443
      - HOST=0.0.0.0

