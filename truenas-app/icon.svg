<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient Background -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with subtle outline -->
  <circle cx="256" cy="256" r="240" fill="#0d1117" stroke="url(#auroraGrad)" stroke-width="8" />
  
  <!-- Outer glowing house shape -->
  <path d="M256,80 L80,220 L80,420 L432,420 L432,220 Z" fill="none" stroke="url(#auroraGrad)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Cute Ghost Mascot in the center -->
  <path d="M256,170 C200,170 180,210 180,260 L180,370 C180,380 190,390 200,390 C210,390 220,380 230,370 C240,360 250,370 256,370 C262,370 272,360 282,370 C292,380 302,390 312,390 C322,390 332,380 332,370 L332,260 C332,210 312,170 256,170 Z" fill="url(#auroraGrad)" opacity="0.85" />
  
  <!-- Ghost Eyes -->
  <circle cx="225" cy="245" r="14" fill="#0d1117" />
  <circle cx="287" cy="245" r="14" fill="#0d1117" />
  
  <!-- Small glowing eyes accents -->
  <circle cx="227" cy="243" r="4" fill="#ffffff" />
  <circle cx="289" cy="243" r="4" fill="#ffffff" />
  
  <!-- Cute ghost smile -->
  <path d="M246,275 Q256,285 266,275" fill="none" stroke="#0d1117" stroke-width="4" stroke-linecap="round" />
</svg>
