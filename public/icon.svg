<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Aurora Primary Gradient (Cyan -> Electric Blue -> Emerald) -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <!-- Emerald Glow Accent -->
    <linearGradient id="emerald-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glassmorphic Translucent Fill -->
    <linearGradient id="glass-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Soft Diffuse Glow Filter -->
    <filter id="soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Outer Card Ambient Shadow -->
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00f2fe" flood-opacity="0.22" />
    </filter>
  </defs>
  
  <!-- Base Squircle with Edge Light -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" filter="url(#card-shadow)"/>
  
  <!-- Subtle Internal Specular Top-Light -->
  <path d="M 136 26 L 376 26 Q 486 26 486 136 L 486 150 Q 380 90 256 90 Q 132 90 26 150 L 26 136 Q 26 26 136 26 Z" fill="rgba(255,255,255,0.06)" />

  <!-- Ambient Aurora Backlight Orb -->
  <circle cx="256" cy="190" r="140" fill="url(#aurora-grad)" opacity="0.2" filter="url(#soft-glow)"/>
  
  <!-- Glassmorphism House Outer Body -->
  <path d="M 256 96 L 416 224 L 416 384 C 416 404 400 420 380 420 L 132 420 C 112 420 96 404 96 384 L 96 224 Z" 
        fill="url(#glass-fill)" stroke="rgba(255,255,255,0.22)" stroke-width="2.5" />
  
  <!-- Glowing Neon Roof Contour -->
  <path d="M 96 224 L 256 96 L 416 224" fill="none" stroke="url(#aurora-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
  
  <!-- Floating Smart IoT Wireless Radio Waves -->
  <path d="M 226 68 A 42 42 0 0 1 286 68" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 206 48 A 70 70 0 0 1 306 48" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <circle cx="256" cy="85" r="4.5" fill="#ffffff" filter="url(#soft-glow)"/>

  <!-- Dashboard Control Deck Base -->
  <rect x="140" y="216" width="232" height="156" rx="18" fill="rgba(0,0,0,0.45)" stroke="rgba(0,242,254,0.35)" stroke-width="2"/>
  
  <!-- 3 Mini Dashboard Widgets -->
  <!-- 1. Climate / Temp Widget -->
  <g transform="translate(156, 232)">
    <rect width="62" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <circle cx="31" cy="22" r="12" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="31" cy="22" r="4" fill="#00f2fe"/>
    <rect x="15" y="40" width="32" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
  
  <!-- 2. Power / Tasmota Widget -->
  <g transform="translate(225, 232)">
    <rect width="62" height="54" rx="12" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.35)" stroke-width="1"/>
    <path d="M 33 13 L 26 27 L 35 27 L 28 41" fill="none" stroke="#00ff88" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 3. Pulse / Realtime Status Widget -->
  <g transform="translate(294, 232)">
    <rect width="62" height="54" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <path d="M 9 28 L 19 28 L 26 14 L 34 40 L 42 24 L 53 28" fill="none" stroke="#4facfe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Interactive Slider / Deck Status Bar -->
  <g transform="translate(156, 306)">
    <rect width="200" height="12" rx="6" fill="rgba(255,255,255,0.08)"/>
    <rect width="130" height="12" rx="6" fill="url(#emerald-grad)"/>
    <circle cx="130" cy="6" r="10" fill="#ffffff" filter="url(#soft-glow)"/>
    <circle cx="130" cy="6" r="4" fill="#00f2fe"/>
  </g>

  <!-- Bottom Navigation Glow Dots -->
  <circle cx="236" cy="348" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="256" cy="348" r="4.5" fill="#00f2fe" filter="url(#soft-glow)"/>
  <circle cx="276" cy="348" r="3" fill="#ffffff" opacity="0.3"/>
</svg>