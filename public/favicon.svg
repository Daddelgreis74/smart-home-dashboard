<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Beautiful gradient matching Neo-Aurora theme -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="99%" stop-color="#fecfef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing neon ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#auroraGrad)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Stylized House roof and walls -->
  <path d="M 256,90 L 410,220 L 410,400 Q 410,410 400,410 L 112,410 Q 102,410 102,400 L 102,220 Z" 
        fill="none" stroke="url(#auroraGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Cute Ghost in the center -->
  <path d="M 256,180 C 210,180 185,210 185,260 L 185,340 Q 202.5,355 220,340 Q 238,325 256,340 Q 274,355 292,340 Q 309.5,325 327,340 L 327,260 C 327,210 302,180 256,180 Z" 
        fill="url(#cyberGrad)" opacity="0.9" filter="url(#glow)"/>
        
  <!-- Ghost Eyes -->
  <circle cx="230" cy="245" r="10" fill="#1e1e24" />
  <circle cx="282" cy="245" r="10" fill="#1e1e24" />
  
  <!-- Ghost Cheeks -->
  <circle cx="218" cy="258" r="6" fill="#ff0844" opacity="0.6" />
  <circle cx="294" cy="258" r="6" fill="#ff0844" opacity="0.6" />
  
  <!-- Ghost Smile -->
  <path d="M 246,260 Q 256,268 266,260" fill="none" stroke="#1e1e24" stroke-width="4" stroke-linecap="round" />
</svg>
