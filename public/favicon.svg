<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Beautiful gradient matching Neo-Aurora theme -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="99%" stop-color="#fecfef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing neon ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#auroraGrad)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>
  
  <!-- Stylized House roof and walls -->
  <path d="M 256,90 L 410,220 L 410,400 Q 410,410 400,410 L 112,410 Q 102,410 102,400 L 102,220 Z" 
        fill="none" stroke="url(#auroraGrad)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- 3D N Logo in the center -->
  <g transform="translate(180, 190) scale(1.52)">
    <defs>
      <linearGradient id="fav-silver-left" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="25%" stop-color="#e2e8f0" />
        <stop offset="50%" stop-color="#94a3b8" />
        <stop offset="80%" stop-color="#cbd5e1" />
        <stop offset="100%" stop-color="#475569" />
      </linearGradient>
      <linearGradient id="fav-silver-right" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cbd5e1" />
        <stop offset="30%" stop-color="#94a3b8" />
        <stop offset="70%" stop-color="#475569" />
        <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>
      <linearGradient id="fav-diagonal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569" />
        <stop offset="50%" stop-color="#1e293b" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>
      <filter id="fav-shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.65"/>
      </filter>
    </defs>
    <!-- Left Pillar + U-Loop -->
    <path d="M 24,22 A 7,7 0 0,1 38,22 L 38,73 A 7,7 0 0,1 31,80 L 16,80 A 4,4 0 0,1 12,76 L 12,59 A 4,4 0 0,1 20,59 L 20,72 A 2,2 0 0,0 22,74 A 2,2 0 0,0 24,72 L 24,22 Z" fill="url(#fav-silver-left)" />
    
    <!-- Right Pillar -->
    <rect x="64" y="15" width="14" height="65" rx="7" fill="url(#fav-silver-right)" />

    <!-- Diagonal Dark Ribbon with Shadow -->
    <path d="M 24,22 L 64,78 A 7,7 0 0,0 78,74 L 38,18 A 7,7 0 0,0 24,22 Z" fill="url(#fav-diagonal-dark)" filter="url(#fav-shadow-filter)" />
    
    <!-- Glossy Highlights -->
    <path d="M 24,22 L 64,78" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
    <path d="M 24,25 L 24,70" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.4" />
    <path d="M 64,25 L 64,70" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.3" />
  </g>
